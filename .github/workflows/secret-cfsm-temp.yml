name: secret-cfsm-temp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret:
    runs-on: ubuntu-latest
    steps:
      - name: Read worker vars from versions API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CF_TOKEN"
          VID=$(curl -s -H "$AUTH" "$API/accounts/$CF_ACCT/workers/scripts/cf-server-monitor/versions" | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"]["items"][0]["id"])')
          echo "VID=$VID"
          curl -s -H "$AUTH" "$API/accounts/$CF_ACCT/workers/scripts/cf-server-monitor/versions/$VID" > version.json
          python3 - <<'PY' > secret.txt
          import json
          d=json.load(open("version.json"))
          r=d.get("result") or {}
          def walk(o, path=""):
              if isinstance(o, dict):
                  for k,v in o.items():
                      if k=="API_SECRET" and isinstance(v,str):
                          print("API_SECRET:", v)
                      walk(v, path+"/"+k)
              elif isinstance(o, list):
                  for x in o: walk(x, path)
          walk(d)
          print("--- top keys:", list(r.keys()))
          print("--- has vars:", "vars" in json.dumps(d))
          PY
          cat secret.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cfsm-secret
          path: secret.txt
