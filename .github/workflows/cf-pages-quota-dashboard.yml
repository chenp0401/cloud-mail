name: One-shot - deploy quota dashboard to CF Pages

# 一次性部署：把 public 数据仓库里的 index.html 直传到 Cloudflare Pages。
# ⛔ 不改 DNS：tokens.uctest.cn 的 CNAME 仍指向 EdgeOne，切换需人工确认。
# ⛔ Token 用本仓库(chenp0401/cloud-mail)已有的 CLOUDFLARE_API_TOKEN / ACCOUNT_ID。
# 用完请删除本 workflow。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch frontend HTML from public data repo
        run: |
          mkdir -p dist
          curl -fsSL "https://raw.githubusercontent.com/chenp0401/glm-quota-data/main/index.html" -o dist/index.html
          echo "downloaded bytes: $(wc -c < dist/index.html)"
          grep -q 'glm-quota-data/main' dist/index.html && echo "DATA_BASE OK"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=glm-quota-dashboard --branch=main
