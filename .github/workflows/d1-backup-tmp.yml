name: TMP D1 Backup (v3.6.0 upgrade 2026-11-19)
on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"
      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker
      - name: Cleanup E2E test data
        working-directory: ./mail-worker
        run: |
          pnpm wrangler telemetry disable || true
          SUBJECT='[E2E] v3.6.0 attachment key derivation'
          pnpm wrangler d1 execute "$NAME" --remote --command "DELETE FROM attachments WHERE email_id IN (SELECT email_id FROM email WHERE subject = '$SUBJECT'); DELETE FROM star WHERE email_id IN (SELECT email_id FROM email WHERE subject = '$SUBJECT'); DELETE FROM email WHERE subject = '$SUBJECT';"
          echo "--- cleanup verify ---"
          pnpm wrangler d1 execute "$NAME" --remote --json --command "SELECT count(*) AS total FROM email; SELECT count(*) AS e2e_left FROM email WHERE subject = '$SUBJECT';"
          KV_RAW=$(pnpm wrangler kv namespace list 2>&1)
          echo "--- kv namespace list (tail) ---"
          echo "$KV_RAW" | tail -20
          KV_ID=$(echo "$KV_RAW" | jq -r --arg n "$NAME" '[.. | objects | select(.title? == $n) | .id?] | map(select(. != null)) | .[0] // empty' 2>/dev/null)
          echo "kv_namespace=$KV_ID"
          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            pnpm wrangler kv key delete "attachments/0bb1369d314cdb4ed4e320f4099868ee.txt" --namespace-id "$KV_ID" 2>&1 || true
          fi
      - name: Pre-upgrade table baseline
        working-directory: ./mail-worker
        run: |
          pnpm wrangler telemetry disable || true
          echo "Looking for D1 database: $NAME"
          pnpm wrangler d1 list --json > /tmp/d1list.json
          DB_UUID=$(jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid' /tmp/d1list.json | head -1)
          if [ -z "$DB_UUID" ] || [ "$DB_UUID" = "null" ]; then
            echo "ERROR: D1 database not found"; jq . /tmp/d1list.json; exit 1
          fi
          echo "Found D1 uuid=$DB_UUID"
          pnpm wrangler d1 execute "$NAME" --remote --json --command "SELECT (SELECT count(*) FROM email) AS email, (SELECT count(*) FROM user) AS user, (SELECT count(*) FROM setting) AS setting, (SELECT count(*) FROM attachments) AS attachments, (SELECT count(*) FROM account) AS account;" | tee /tmp/pre-baseline.json
          echo "--- schema columns (setting / email) ---"
          pnpm wrangler d1 execute "$NAME" --remote --command "PRAGMA table_info(setting);" || true
          pnpm wrangler d1 execute "$NAME" --remote --command "PRAGMA table_info(email);" || true
      - name: Export D1
        working-directory: ./mail-worker
        run: |
          pnpm wrangler telemetry disable || true
          pnpm wrangler d1 export "$NAME" --remote --output /tmp/cloud-mail-d1-backup.sql
          ls -lh /tmp/cloud-mail-d1-backup.sql
          echo "--- first lines ---"
          head -5 /tmp/cloud-mail-d1-backup.sql
          echo "--- table count ---"
          grep -c 'CREATE TABLE' /tmp/cloud-mail-d1-backup.sql || true
          echo "--- INSERT count ---"
          grep -c '^INSERT INTO' /tmp/cloud-mail-d1-backup.sql || true
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-mail-d1-backup-20261119
          path: |
            /tmp/cloud-mail-d1-backup.sql
            /tmp/pre-baseline.json
          retention-days: 7
          if-no-files-found: error
