name: TMP D1 Backup (2026-11-08 upgrade)
on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "./mail-worker/pnpm-lock.yaml"
      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: ./mail-worker
      - name: Export D1
        working-directory: ./mail-worker
        run: |
          pnpm wrangler telemetry disable || true
          echo "Looking for D1 database: $NAME"
          pnpm wrangler d1 list --json > /tmp/d1list.json
          DB_UUID=$(jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid' /tmp/d1list.json | head -1)
          if [ -z "$DB_UUID" ] || [ "$DB_UUID" = "null" ]; then
            echo "ERROR: D1 database not found"; jq . /tmp/d1list.json; exit 1
          fi
          echo "Found D1 uuid=$DB_UUID"
          pnpm wrangler d1 export "$NAME" --remote --output /tmp/cloud-mail-d1-backup.sql
          ls -lh /tmp/cloud-mail-d1-backup.sql
          echo "--- first lines ---"
          head -5 /tmp/cloud-mail-d1-backup.sql
          echo "--- table count ---"
          grep -c 'CREATE TABLE' /tmp/cloud-mail-d1-backup.sql || true
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-mail-d1-backup-20261108
          path: /tmp/cloud-mail-d1-backup.sql
          retention-days: 7
          if-no-files-found: error
