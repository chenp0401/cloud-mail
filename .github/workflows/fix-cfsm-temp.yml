name: fix-cfsm-temp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Enable workers.dev and verify script
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CF_TOKEN"
          echo "=== try enable workers.dev subdomain ==="
          curl -s -X PUT -H "$AUTH" -H "Content-Type: application/json" "$API/accounts/$CF_ACCT/workers/workers.dev" -d '{"subdomain":"chenp-fleet"}' | python3 -m json.tool | head -20
          echo "=== get subdomain ==="
          curl -s -H "$AUTH" "$API/accounts/$CF_ACCT/workers/workers.dev" | python3 -m json.tool | head -20
          echo "=== script versions ==="
          curl -s -H "$AUTH" "$API/accounts/$CF_ACCT/workers/scripts/cf-server-monitor/versions" | python3 -m json.tool | head -40
