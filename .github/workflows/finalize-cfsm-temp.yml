name: finalize-cfsm-temp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Bind domain and verify
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZONE: f913b88cc02e935bed4be52d84b9050d
          HOST: monitor.uctest.cn
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CF_TOKEN"
          echo "=== scripts now ==="
          curl -sf -H "$AUTH" "$API/accounts/$CF_ACCT/workers/scripts" | python3 -c 'import sys,json; print([x["id"] for x in json.load(sys.stdin)["result"]])'
          echo "=== DNS ==="
          DNS=$(curl -sf -H "$AUTH" "$API/zones/$ZONE/dns_records?name=$HOST" | python3 -c 'import sys,json; print(next((x["id"] for x in json.load(sys.stdin)["result"] if x["name"]=="monitor.uctest.cn"), ""))')
          if [ -z "$DNS" ]; then
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/zones/$ZONE/dns_records" -d "{\"type\":\"CNAME\",\"name\":\"$HOST\",\"content\":\"uctest.cn\",\"proxied\":true,\"ttl\":1}" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("DNS created:", d.get("success"), d.get("errors"))'
          else
            echo "DNS exists: $DNS"
          fi
          echo "=== route ==="
          ROUTE=$(curl -sf -H "$AUTH" "$API/zones/$ZONE/workers/routes" | python3 -c 'import sys,json; print(next((x["id"] for x in json.load(sys.stdin)["result"] if x.get("pattern")=="monitor.uctest.cn/*"), ""))')
          if [ -z "$ROUTE" ]; then
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" "$API/zones/$ZONE/workers/routes" -d '{"pattern":"monitor.uctest.cn/*","script":"cf-server-monitor"}' | python3 -c 'import sys,json; d=json.load(sys.stdin); print("Route created:", d.get("success"), d.get("errors"))'
          else
            echo "Route exists: $ROUTE"
          fi
          echo "=== verify via curl ==="
          sleep 3
          curl -s -o /dev/null -w "HTTP %{http_code}\n" -m 20 "https://$HOST/" || true
          curl -s -o /dev/null -w "API HTTP %{http_code}\n" -m 20 "https://$HOST/api/server/list" || true
