name: cf-quota-audit-temp
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Query DO usage
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY' > do2.json
          import os, json, datetime, urllib.request, urllib.error
          T = os.environ["CF_TOKEN"]; A = os.environ["CF_ACCT"]
          now = datetime.datetime.now(datetime.timezone.utc)
          s = (now - datetime.timedelta(days=1)).strftime("%Y-%m-%d")
          e = now.strftime("%Y-%m-%d")
          def gql(q):
              r = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql",
                data=json.dumps({"query": q}).encode(),
                headers={"Authorization": "Bearer " + T, "Content-Type": "application/json"})
              try:
                with urllib.request.urlopen(r, timeout=60) as x: return json.load(x)
              except urllib.error.HTTPError as x: return {"http_error": x.code, "body": x.read().decode()[:600]}
              except Exception as x: return {"error": repr(x)}
          base = 'query($a:string!,$s:Date!,$e:Date!){viewer{accounts(filter:{accountTag:$a}){%s}}}'
          q1 = base % '''inv(filter:{date_geq:$s,date_leq:$e},limit:1000){
          sum{requests} dimensions{namespaceId scriptName date}}'''
          q2 = base % '''inv2:durableObjectsInvocationsAdaptiveGroups(filter:{date_geq:$s,date_leq:$e},limit:1000){
          sum{requests wallTime} dimensions{namespaceId scriptName date}}'''
          q3 = base % '''per:durableObjectsPeriodicGroups(filter:{date_geq:$s,date_leq:$e},limit:1000){
          sum{cpuTime} dimensions{namespaceId scriptName date}}'''
          def run(q):
              r = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql",
                data=json.dumps({"query": q, "variables": {"a": A, "s": s, "e": e}}).encode(),
                headers={"Authorization": "Bearer " + T, "Content-Type": "application/json"})
              try:
                with urllib.request.urlopen(r, timeout=60) as x: return json.load(x)
              except urllib.error.HTTPError as x: return {"http_error": x.code, "body": x.read().decode()[:600]}
              except Exception as x: return {"error": repr(x)}
          print(json.dumps({"range": [s, e], "q1": run(q1), "q2": run(q2), "q3": run(q3)}, ensure_ascii=False, indent=1))
          PY
      - uses: actions/upload-artifact@v4
        with: { name: do2, path: do2.json }
