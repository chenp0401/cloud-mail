name: diag-cfsm-temp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and clean CFSM leftovers
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CF_TOKEN"
          echo "=== scripts ==="
          curl -sf -H "$AUTH" "$API/accounts/$CF_ACCT/workers/scripts" | python3 -c 'import sys,json; print([x["id"] for x in json.load(sys.stdin)["result"]])'
          echo "=== DO namespaces ==="
          curl -sf -H "$AUTH" "$API/accounts/$CF_ACCT/workers/durable_objects/namespaces" | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(x.get("id"),"|",x.get("name"),"|",x.get("script")) for x in d["result"]]'
          echo "=== delete stale DO namespaces named MetricsBroadcaster ==="
          for ID in $(curl -sf -H "$AUTH" "$API/accounts/$CF_ACCT/workers/durable_objects/namespaces" | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(x["id"]) for x in d["result"] if "metric" in x.get("name","").lower() or "broadcast" in x.get("name","").lower()]'); do
            echo "Deleting $ID"
            curl -s -X DELETE -H "$AUTH" "$API/accounts/$CF_ACCT/workers/durable_objects/namespaces/$ID" | python3 -m json.tool | head -8
          done
          echo "=== delete stale worker script if present ==="
          curl -s -X DELETE -H "$AUTH" "$API/accounts/$CF_ACCT/workers/scripts/cf-server-monitor" | python3 -m json.tool | head -8
          echo "=== after cleanup scripts ==="
          curl -sf -H "$AUTH" "$API/accounts/$CF_ACCT/workers/scripts" | python3 -c 'import sys,json; print([x["id"] for x in json.load(sys.stdin)["result"]])'
          echo "=== after cleanup DO namespaces ==="
          curl -sf -H "$AUTH" "$API/accounts/$CF_ACCT/workers/durable_objects/namespaces" | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(x.get("id"),"|",x.get("name")) for x in d["result"]]'
