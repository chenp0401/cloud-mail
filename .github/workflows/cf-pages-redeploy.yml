name: One-shot - redeploy quota dashboard to CF Pages
# 一次性：重新拉取数据仓库的 index.html 部署到已有 CF Pages 项目。用完删除。
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frontend
        run: |
          mkdir -p dist
          curl -fsSL "https://raw.githubusercontent.com/chenp0401/glm-quota-data/main/index.html" -o dist/index.html
          grep -q '不要靠 content-type 判 JSON' dist/index.html && echo "FIXED_VERSION_OK"
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=glm-quota-dashboard --branch=main
