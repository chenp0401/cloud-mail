name: deploy-cfsm-temp
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chenp0401/CF-Server-Monitor
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        run: npm install && npm run build:frontend
      - name: Deploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 1. find or create D1
          D1_ID=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/d1/database" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((x["uuid"] for x in d["result"] if x["name"]=="server-monitor-db"), ""))')
          if [ -z "$D1_ID" ]; then
            D1_ID=$(curl -sf -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/d1/database" -d '{"name":"server-monitor-db"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"]["uuid"])')
          fi
          echo "D1_ID=$D1_ID"
          # 2. generate strong secret
          API_SECRET=$(openssl rand -hex 32)
          # 3. write wrangler.toml
          cat > wrangler.toml <<EOF
          name = "cf-server-monitor"
          main = "src/index.js"
          compatibility_date = "2024-12-01"
          compatibility_flags = ["nodejs_compat"]
          keep_vars = true
          [triggers]
          crons = ["*/1 * * * *", "0 * * * *"]
          [assets]
          directory = "./dist"
          binding = "ASSETS"
          [[d1_databases]]
          binding = "DB"
          database_name = "server-monitor-db"
          database_id = "$D1_ID"
          [[durable_objects.bindings]]
          name = "METRICS_BROADCASTER"
          class_name = "MetricsBroadcaster"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MetricsBroadcaster"]
          [vars]
          API_SECRET = "$API_SECRET"
          API_USER_NAME = "admin"
          CORS_ALLOWED_ORIGINS = ""
          EOF
          # 4. deploy
          export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$CF_ACCT"
          npx wrangler@4 deploy > deploy.log 2>&1 || { cat deploy.log; exit 1; }
          tail -20 deploy.log
          # 5. workers.dev url
          SUB=$(curl -sf -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/workers/workers.dev" | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"]["subdomain"])')
          URL="https://cf-server-monitor.$SUB.workers.dev"
          python3 - "$URL" "$API_SECRET" "$D1_ID" <<'PY' > result.json
          import json,sys
          print(json.dumps({"worker_url":sys.argv[1],"api_secret":sys.argv[2],"d1_id":sys.argv[3]},indent=1))
          PY
          echo "WORKER_URL=$URL"
      - uses: actions/upload-artifact@v4
        with:
          name: cfsm-deploy-result
          path: result.json
