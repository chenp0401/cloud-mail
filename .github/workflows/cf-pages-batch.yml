name: One-shot - batch deploy 6 dashboards to CF Pages
# 一次性：批量部署 glm2~glm7 到各自 CF Pages 项目。用完删除。
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        d: [glm2, glm3, glm4, glm5, glm6, glm7]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch frontend
        run: |
          mkdir -p dist
          curl -fsSL "https://raw.githubusercontent.com/chenp0401/glm-quota-data/main/${{ matrix.d }}/index.html" -o dist/index.html
          echo "bytes=$(wc -c < dist/index.html)"
          grep -q 'raw.githubusercontent.com/chenp0401/glm-quota-data/main/${{ matrix.d }}/' dist/index.html && echo "DATA_BASE_OK"
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=glm-${{ matrix.d }} --branch=main
